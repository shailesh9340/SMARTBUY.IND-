<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flipstore - Pro Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 pb-16 text-gray-800 antialiased">

    <div id="toastContainer" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none"></div>

    <div id="homeView" class="tab-content block animate-fade-in">
        <div class="bg-white px-3 pt-3 pb-2 sticky top-0 z-40 shadow-sm transition-all">
            <div class="flex justify-between gap-2 mb-3">
                <button class="flex-1 bg-blue-50 text-blue-600 font-bold text-xs py-2 rounded flex justify-center items-center gap-1 border border-blue-100"><i class="fas fa-shopping-bag"></i> Flipstore</button>
                <button class="flex-1 bg-gray-50 text-gray-700 font-bold text-xs py-2 rounded flex justify-center items-center gap-1 border border-gray-100"><i class="fas fa-rupee-sign text-blue-500"></i> Finance</button>
                <button class="flex-1 bg-gray-50 text-gray-700 font-bold text-xs py-2 rounded flex justify-center items-center gap-1 border border-gray-100"><i class="fas fa-plane text-blue-500"></i> Travel</button>
            </div>
            
            <div class="flex justify-between items-center mb-3">
                <div class="text-xs font-semibold text-gray-700 flex items-center gap-1 truncate max-w-[70%] cursor-pointer" onclick="openAddressForm()" id="homeTopAddress">
                    <i class="fas fa-map-marker-alt text-blue-600"></i> Add Delivery Address <i class="fas fa-chevron-down text-[10px]"></i>
                </div>
                <div class="bg-gray-100 px-2 py-1 rounded text-xs font-bold flex items-center gap-1">
                    <i class="fas fa-bolt text-yellow-500"></i> 0
                </div>
            </div>

            <div class="relative shadow-sm rounded-md">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" placeholder="Search for products, brands and more" class="w-full bg-gray-50 text-sm py-2.5 pl-9 pr-10 rounded-md outline-none border border-gray-200 focus:border-blue-500 focus:bg-white transition-colors">
                <i class="fas fa-camera absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 cursor-pointer"></i>
            </div>
        </div>

        <div class="bg-white p-3 mt-1">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-sm">Recommended for You</h2>
                <button class="bg-blue-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-md"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2" id="homeProductSlider">
                </div>
        </div>
    </div>

    <div id="cartView" class="tab-content hidden h-full flex flex-col relative pb-16 animate-fade-in">
        <div class="bg-white flex shadow-sm sticky top-0 z-10">
            <button class="flex-1 py-3 text-blue-600 border-b-2 border-blue-600 font-bold text-sm">Flipstore (<span id="cartCount">0</span>)</button>
            <button class="flex-1 py-3 text-gray-500 font-medium text-sm">Grocery</button>
        </div>

        <div class="bg-white p-3 border-b text-sm mt-1 flex justify-between items-center" id="cartAddressBox">
            </div>

        <div id="cartItemsContainer" class="flex-1 overflow-y-auto">
            </div>

        <div class="fixed bottom-[56px] left-0 right-0 bg-white border-t p-2 px-4 flex justify-between items-center z-40 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
            <div>
                <p class="text-xs text-gray-400 line-through" id="cartBottomMrp">₹0</p>
                <p class="text-lg font-bold" id="cartTotalText">₹0</p>
            </div>
            <button onclick="openCheckout()" class="bg-[#ffc200] active:bg-[#e6af00] text-black font-bold px-8 py-3 rounded-sm w-40 text-sm shadow-sm transition-colors">Place Order</button>
        </div>
    </div>

    <div id="addressFormView" class="fixed inset-0 bg-gray-50 z-[60] hidden flex flex-col animate-slide-up">
        <div class="bg-blue-600 text-white p-4 flex items-center gap-4 shadow-md sticky top-0">
            <i class="fas fa-arrow-left text-lg cursor-pointer" onclick="closeAddressForm()"></i>
            <h1 class="text-lg font-medium">Add Delivery Address</h1>
        </div>
        <form id="addressForm" class="p-4 flex-1 overflow-y-auto bg-white mt-2" onsubmit="saveAddress(event)">
            <p id="formError" class="text-red-500 text-xs font-bold hidden mb-3"><i class="fas fa-exclamation-circle"></i> Please fill all required fields correctly.</p>
            <div class="space-y-4">
                <div class="relative">
                    <label class="text-[10px] text-gray-500 font-bold uppercase absolute -top-2 left-2 bg-white px-1">Full Name *</label>
                    <input type="text" id="addName" required class="w-full border border-gray-300 rounded-md p-3 outline-none focus:border-blue-600 transition-colors">
                </div>
                <div class="relative">
                    <label class="text-[10px] text-gray-500 font-bold uppercase absolute -top-2 left-2 bg-white px-1">Phone Number *</label>
                    <input type="tel" id="addPhone" pattern="[0-9]{10}" required class="w-full border border-gray-300 rounded-md p-3 outline-none focus:border-blue-600 transition-colors">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="relative">
                        <label class="text-[10px] text-gray-500 font-bold uppercase absolute -top-2 left-2 bg-white px-1">Pincode *</label>
                        <input type="number" id="addPin" required class="w-full border border-gray-300 rounded-md p-3 outline-none focus:border-blue-600 transition-colors">
                    </div>
                    <div class="relative">
                        <label class="text-[10px] text-gray-500 font-bold uppercase absolute -top-2 left-2 bg-white px-1">City *</label>
                        <input type="text" id="addCity" required class="w-full border border-gray-300 rounded-md p-3 outline-none focus:border-blue-600 transition-colors">
                    </div>
                </div>
                <div class="relative">
                    <label class="text-[10px] text-gray-500 font-bold uppercase absolute -top-2 left-2 bg-white px-1">Full Address *</label>
                    <textarea id="addFullAddress" rows="3" required class="w-full border border-gray-300 rounded-md p-3 outline-none focus:border-blue-600 transition-colors"></textarea>
                </div>
            </div>
            <button type="submit" class="w-full bg-[#fb641b] active:bg-[#df5615] text-white font-bold py-4 rounded-sm shadow-md mt-8 transition-colors">Save Address</button>
        </form>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-between items-center pb-1 z-30 shadow-[0_-2px_5px_rgba(0,0,0,0.05)]">
        <button onclick="switchTab('homeView', this)" class="nav-btn text-blue-600 flex-1 flex flex-col items-center pt-2 pb-1">
            <i class="fas fa-home text-lg mb-0.5"></i><span class="text-[10px] font-medium">Home</span>
        </button>
        <button onclick="switchTab('cartView', this)" class="nav-btn text-gray-500 flex-1 flex flex-col items-center pt-2 pb-1 relative">
            <i class="fas fa-shopping-cart text-lg mb-0.5"></i><span class="text-[10px] font-medium">Cart</span>
            <span id="navCartBadge" class="absolute top-1 right-10 bg-red-500 text-white text-[8px] font-bold px-1.5 py-0.5 rounded-full border border-white hidden">0</span>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
