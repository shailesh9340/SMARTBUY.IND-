<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipstore by Flipkart</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
* { font-family: 'Poppins', sans-serif; }
body { background: #f5f7fa; min-height:100vh; }

.fade-in { animation: fadeIn 0.6s ease-out; }
@keyframes fadeIn { from {opacity:0; transform:translateY(-20px);} to {opacity:1; transform:translateY(0);} }
.slide-up { animation: slideUp 0.4s ease-out; }
@keyframes slideUp { from {transform:translateY(100%);} to {transform:translateY(0);} }
.pulse { animation: pulse 1s infinite; }
@keyframes pulse {0%,100%{opacity:1;}50%{opacity:0.5;}}
::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-thumb{background:#667eea;border-radius:2px;}

.btn-gradient { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);}
.btn-gradient:hover { background: linear-gradient(135deg,#5a6fd6 0%,#6a4190 100%);}
.checkmark { animation: checkmark 0.5s ease-out; }
@keyframes checkmark {0%{transform:scale(0);}50%{transform:scale(1.2);}100%{transform:scale(1);}}
</style>
</head>
<body class="pb-20">

<!-- Splash Animation -->
<div id="splash" class="fixed inset-0 bg-gradient-to-r from-blue-500 to-indigo-600 flex items-center justify-center z-50">
  <h1 class="text-4xl font-extrabold text-white">Flipstore by Flipkart</h1>
</div>

<!-- Login Overlay -->
<div id="loginOverlay" class="fixed inset-0 z-50 flex items-center justify-center hidden">
  <div class="w-full max-w-md px-6">
    <div class="bg-white rounded-3xl shadow-2xl p-8 fade-in">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-extrabold">Flip<span class="text-blue-600">Store</span></h1>
        <p class="text-gray-500 mt-2 text-sm">Your Trusted Reselling Partner</p>
      </div>
      <form id="loginForm" class="space-y-5">
        <input type="text" id="userName" placeholder="Enter your name" class="w-full px-4 py-3 rounded-xl border border-gray-300" required>
        <input type="tel" id="userMobile" placeholder="Enter mobile number" pattern="[0-9]{10}" class="w-full px-4 py-3 rounded-xl border border-gray-300" required>
        <button type="submit" class="w-full btn-gradient text-white py-4 rounded-xl font-semibold">
          <i class="fas fa-shopping-bag mr-2"></i>Enter Shop
        </button>
      </form>
      <p class="text-center text-xs text-gray-400 mt-6">By continuing, you agree to our Terms & Privacy Policy</p>
    </div>
  </div>
</div>

<!-- Main App -->
<div id="mainApp" class="hidden">

<!-- Header -->
<header class="sticky top-0 bg-white shadow-md z-40">
  <div class="px-4 py-3 flex items-center justify-between">
    <h1 class="text-xl font-extrabold">Flip<span class="text-blue-600">Store</span></h1>
    <div class="flex-1 mx-4 relative">
      <input type="text" id="searchInput" placeholder="Search products..." class="w-full px-4 py-2 pl-10 rounded-full border border-gray-200 focus:border-blue-500 focus:outline-none bg-gray-50 text-sm">
      <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
    </div>
    <button class="relative p-2"><i class="fas fa-shopping-cart text-gray-700 text-lg"></i></button>
  </div>
</header>

<!-- Banner -->
<div id="userBanner" class="hidden bg-gradient-to-r from-blue-500 to-indigo-600 px-4 py-2">
  <p class="text-white text-sm"><i class="fas fa-user-circle mr-1"></i> Welcome, <span id="loggedInUser" class="font-semibold"></span></p>
</div>

<!-- Categories -->
<section class="px-4 py-4">
  <h2 class="text-lg font-bold mb-3">Categories</h2>
  <div id="categories" class="flex gap-3 overflow-x-auto"></div>
</section>

<!-- Products -->
<main class="px-4 py-2">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-lg font-bold text-gray-800">Hot Deals</h2>
    <span id="productCount" class="text-sm text-gray-500">0 products</span>
  </div>
  <div id="productsGrid" class="grid grid-cols-2 gap-4"></div>
</main>

<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40">
  <div class="flex justify-around items-center py-2">
    <button class="nav-item active flex flex-col items-center py-2 px-4" data-nav="home">
      <i class="fas fa-home text-xl mb-1"></i><span class="text-xs">Home</span>
    </button>
    <button class="nav-item flex flex-col items-center py-2 px-4" data-nav="categories">
      <i class="fas fa-th-large text-xl mb-1"></i><span class="text-xs">Categories</span>
    </button>
    <button class="nav-item flex flex-col items-center py-2 px-4" data-nav="account">
      <i class="fas fa-user text-xl mb-1"></i><span class="text-xs">Account</span>
    </button>
  </div>
</nav>

<!-- Order Page -->
<div id="orderPage" class="hidden fixed inset-0 bg-white z-50 overflow-y-auto p-4">
  <button onclick="closeOrderPage()" class="text-gray-500 mb-4"><i class="fas fa-arrow-left"></i> Back</button>
  <h2 class="text-2xl font-bold mb-4">Order Summary</h2>
  <div id="orderDetails" class="mb-4"></div>
  <button id="donateBtn" class="btn-gradient w-full py-3 rounded-xl text-white font-semibold">Donate to Flipstore Foundation</button>
</div>

</div>

<script>
// ============================================
// Splash
// ============================================
setTimeout(()=>{document.getElementById('splash').style.display='none';document.getElementById('loginOverlay').classList.remove('hidden');},2000);

// ============================================
// Sample Data
// ============================================
const categoriesData = [
  {id:1,name:'Electronics',sub:['Phones','Laptops','Accessories']},
  {id:2,name:'Fashion',sub:['Men','Women','Kids']},
  {id:3,name:'Toys',sub:['Soft Toys','Learning','Games']}
];

const products = [
  {id:1,name:'Bluetooth Earbuds',price:299,oldPrice:599,image:'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400',category:'Electronics'},
  {id:2,name:'Smart Watch',price:1499,oldPrice:2999,image:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400',category:'Electronics'},
  {id:3,name:'Men Shirt',price:449,oldPrice:899,image:'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400',category:'Fashion'}
];

// ============================================
// App State
// ============================================
let currentUser = null;
let currentProduct = null;

// ============================================
// Login
// ============================================
document.getElementById('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  const name=document.getElementById('userName').value;
  const mobile=document.getElementById('userMobile').value;
  if(!name||!mobile){alert('Fill fields');return;}
  currentUser={name,mobile};
  localStorage.setItem('flipstore_user',JSON.stringify(currentUser));
  document.getElementById('loginOverlay').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('userBanner').classList.remove('hidden');
  document.getElementById('loggedInUser').textContent=name;
  renderCategories();
  renderProducts(products);
});

// ============================================
// Render Categories
// ============================================
function renderCategories(){
  const container=document.getElementById('categories');
  container.innerHTML=categoriesData.map(cat=>`<div class="bg-white px-4 py-2 rounded-xl shadow cursor-pointer">${cat.name}</div>`).join('');
}

// ============================================
// Render Products
// ============================================
function renderProducts(list){
  document.getElementById('productCount').textContent=list.length+' products';
  const grid=document.getElementById('productsGrid');
  grid.innerHTML=list.map(p=>`
    <div class="bg-white rounded-2xl shadow overflow-hidden cursor-pointer" onclick="openOrderPage(${p.id})">
      <img src="${p.image}" class="w-full h-36 object-cover"/>
      <div class="p-3">
        <h3 class="font-semibold">${p.name}</h3>
        <div class="flex items-baseline gap-2">
          <span class="text-green-600 font-bold">₹${p.price}</span>
          <span class="line-through text-gray-400">₹${p.oldPrice}</span>
        </div>
      </div>
    </div>
  `).join('');
}

// ============================================
// Open Order Page
// ============================================
function openOrderPage(id){
  currentProduct=products.find(p=>p.id===id);
  const orderDetails=document.getElementById('orderDetails');
  orderDetails.innerHTML=`
    <p><strong>Deliver To:</strong> ${currentUser.name}, ${currentUser.mobile}</p>
    <p><strong>Product:</strong> ${currentProduct.name}</p>
    <p><strong>Price:</strong> ₹${currentProduct.price}</p>
  `;
  document.getElementById('orderPage').classList.remove('hidden');
}

// ============================================
// Close Order Page
// ============================================
function closeOrderPage(){document.getElementById('orderPage').classList.add('hidden');}

// ============================================
// Donate Button
// ============================================
document.getElementById('donateBtn').addEventListener('click',()=>{alert('UPI: 9343988416-4@ybl')});

// ============================================
// Navigation
// ============================================
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click',e=>{
    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
    btn.classList.add('active');
    if(btn.dataset.nav==='account'){
      alert(`Telegram Join: https://t.me/smartbuyind\nWhatsApp Channel: https://whatsapp.com/channel/0029Vb8JdHwKGGGBmkchDJ2Y`);
    }
  });
});
</script>

</body>
</html>
