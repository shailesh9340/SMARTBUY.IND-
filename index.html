<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipStore - Mobile-First Reselling App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        * { font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg,#f5f7fa 0%,#e4e8ec 100%); min-height:100vh; }
        #loginOverlay { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); animation: fadeIn .5s ease-out; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(-20px);} to{opacity:1;transform:translateY(0);} }
        @keyframes slideUp { from{transform:translateY(100%);} to{transform:translateY(0);} }
        @keyframes pulse {0%,100%{opacity:1;}50%{opacity:.5;}}
        .slide-up{animation:slideUp .4s ease-out;}
        .processing-btn{animation:pulse 1s infinite;}
        ::-webkit-scrollbar{width:4px;}
        ::-webkit-scrollbar-thumb{background:#667eea;border-radius:2px;}
        .product-card{transition:.3s;}
        .product-card:hover{transform:translateY(-4px);box-shadow:0 10px 25px rgba(0,0,0,.15);}
        .sheet-overlay{background:rgba(0,0,0,.5);backdrop-filter:blur(4px);}
        .nav-item.active{color:#667eea;}
        .btn-gradient{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);}
        .btn-gradient:hover{background:linear-gradient(135deg,#5a6fd6 0%,#6a4190 100%);}
        @keyframes checkmark{0%{transform:scale(0);}50%{transform:scale(1.2);}100%{transform:scale(1);}}
        .checkmark{animation:checkmark .5s ease-out;}
    </style>
</head>
<body class="pb-20">

<!-- LOGIN OVERLAY -->
<div id="loginOverlay" class="fixed inset-0 z-50 flex items-center justify-center">
<div class="w-full max-w-md px-6">
<div class="bg-white rounded-3xl shadow-2xl p-8">
<div class="text-center mb-8">
<h1 class="text-4xl font-extrabold">
Flip<span style="color:#667eea;">Store</span>
</h1>
<p class="text-gray-500 mt-2 text-sm">Your Trusted Reselling Partner</p>
</div>

<form id="loginForm" class="space-y-5">
<input type="text" id="userName" required placeholder="Enter your name"
class="w-full px-4 py-3 rounded-xl border border-gray-300">
<input type="tel" id="userMobile" required pattern="[0-9]{10}"
placeholder="Enter mobile number"
class="w-full px-4 py-3 rounded-xl border border-gray-300">
<button type="submit"
class="w-full btn-gradient text-white font-semibold py-4 rounded-xl shadow-lg">
<i class="fas fa-shopping-bag mr-2"></i>Enter Shop
</button>
</form>
</div>
</div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden">
<header class="sticky top-0 z-40 bg-white shadow-md">
<div class="px-4 py-3 flex items-center justify-between gap-3">
<h1 class="text-xl font-extrabold">
Flip<span style="color:#667eea;">Store</span>
</h1>
<input type="text" id="searchInput"
class="flex-1 px-4 py-2 rounded-full border border-gray-200 text-sm"
placeholder="Search products...">
<button class="p-2">
<i class="fas fa-shopping-cart text-gray-700 text-lg"></i>
</button>
</div>
</header>

<div id="userBanner" class="hidden bg-gradient-to-r from-purple-500 to-indigo-600 px-4 py-2">
<p class="text-white text-sm">
Welcome, <span id="loggedInUser" class="font-semibold"></span>
</p>
</div>

<main class="px-4 py-4">
<div class="flex justify-between mb-4">
<h2 class="text-lg font-bold">Hot Deals</h2>
<span id="productCount" class="text-sm text-gray-500"></span>
</div>
<div id="productsGrid" class="grid grid-cols-2 gap-4"></div>
</main>
</div>

<!-- ORDER SHEET -->
<div id="orderSheet" class="fixed inset-0 z-50 hidden">
<div class="sheet-overlay absolute inset-0" onclick="closeOrderSheet()"></div>
<div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl slide-up max-h-[90vh] overflow-y-auto">

<div class="flex justify-center py-3">
<div class="w-12 h-1 bg-gray-300 rounded-full"></div>
</div>

<div class="px-6 pb-4 border-b">
<h3 class="text-xl font-bold">Confirm Order</h3>
</div>

<div id="orderProductInfo" class="px-6 py-4 bg-gray-50"></div>

<form id="orderForm" class="px-6 py-4 space-y-4">
<input type="text" id="orderCustomerName" required placeholder="Customer Name"
class="w-full px-4 py-3 rounded-xl border border-gray-300">
<input type="tel" id="orderWhatsApp" required pattern="[0-9]{10}"
placeholder="WhatsApp Number"
class="w-full px-4 py-3 rounded-xl border border-gray-300">
<textarea id="orderAddress" required rows="3"
placeholder="Full Address"
class="w-full px-4 py-3 rounded-xl border border-gray-300"></textarea>

<button type="submit" id="confirmOrderBtn"
class="w-full btn-gradient text-white font-semibold py-4 rounded-xl">
<span id="btnText">Confirm Order</span>
<span id="btnProcessing" class="hidden">Processing...</span>
</button>
</form>

<div id="orderSuccess" class="hidden px-6 py-8 text-center">
<div class="checkmark w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
<i class="fas fa-check text-green-500 text-4xl"></i>
</div>
<h3 class="text-2xl font-bold">Order Placed!</h3>
<button onclick="closeOrderSheet()"
class="bg-green-500 text-white px-8 py-3 rounded-xl mt-4">
Continue Shopping
</button>
</div>

</div>
</div>

<script>

// TELEGRAM CONFIG
const TELEGRAM_BOT_TOKEN = "7996956533:AAGRbrHJva3t0Pyfu7Met1ttg2w-974msb4";
const TELEGRAM_CHAT_ID = "8450221415";

async function sendToTelegram(message){
const url=`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
await fetch(url,{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
chat_id:TELEGRAM_CHAT_ID,
text:message,
parse_mode:"HTML"
})
});
}

// PRODUCTS
const products=[ ... ]; // (Same products array from your original — unchanged)

// LOGIN
document.getElementById("loginForm").addEventListener("submit",async function(e){
e.preventDefault();
const name=userName.value;
const mobile=userMobile.value;

localStorage.setItem("flipstore_user",JSON.stringify({name,mobile}));

await sendToTelegram(`
🔐 <b>NEW LOGIN</b>
👤 ${name}
📱 ${mobile}
🕒 ${new Date().toLocaleString()}
`);

loginOverlay.classList.add("hidden");
mainApp.classList.remove("hidden");
userBanner.classList.remove("hidden");
loggedInUser.textContent=name;
renderProducts(products);
});

// ORDER
document.getElementById("orderForm").addEventListener("submit",async function(e){
e.preventDefault();

btnText.classList.add("hidden");
btnProcessing.classList.remove("hidden");

await sendToTelegram(`
🛒 <b>NEW ORDER</b>
👤 ${orderCustomerName.value}
📦 ${currentProduct.name}
💰 ₹${currentProduct.price}
📱 ${orderWhatsApp.value}
🏠 ${orderAddress.value}
🕒 ${new Date().toLocaleString()}
`);

btnText.classList.remove("hidden");
btnProcessing.classList.add("hidden");

orderForm.classList.add("hidden");
orderSuccess.classList.remove("hidden");
});

</script>
</body>
</html>
